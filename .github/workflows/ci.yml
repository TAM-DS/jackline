name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Rogue-agent demo must contain the agent
        run: jackline demo --no-color
      - name: Shipped policies lint
        run: |
          jackline lint examples/policies/capital-markets.toml
          jackline lint jackline/starter.toml

  # Dogfooding the portfolio: Jackline's own repo is guarded by DeadBolt.
  deadbolt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: TAM-DS/deadbolt@v0.1.0
        with:
          fail-on: low
