[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jackline"
version = "0.1.1"
description = "The governed runtime for AI agents: task-scoped grants, deterministic policy, human approvals, budgets and a signed ledger. Clip in. Work freely. Never go overboard."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Tracy Manning" }]
requires-python = ">=3.10"
dependencies = ["tomli>=2.0; python_version < '3.11'"]
keywords = ["ai-agents", "agent-runtime", "agent-governance", "mcp", "human-in-the-loop", "audit", "policy", "security"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
  "Topic :: Security",
  "Intended Audience :: Developers",
]

[project.optional-dependencies]
approvals = ["cryptography>=43"]

[project.urls]
Homepage = "https://github.com/TAM-DS/jackline"

[project.scripts]
jackline = "jackline.cli:main"

[tool.setuptools]
packages = ["jackline"]

[tool.setuptools.package-data]
jackline = ["starter.toml"]
